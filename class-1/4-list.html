<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class 1 - Tag List</title>
  </head>
  <body>
    <!-- ORDERED LIST (Terurut)-->
    <ol>
      <b>List nama nama hewan :</b>
      <li>Ayam</li>
      <li>Bebek</li>
      <li>Harimau</li>
    </ol>

    <!-- UN-ORDERED LIST (Tidak Terurut)-->
    <ul type="disc">
      <b>List nama nama buah :</b>
      <li>Belimbing</li>
      <li>Semangka</li>
      <li>Jambu</li>
    </ul>
  </body>
</html>
