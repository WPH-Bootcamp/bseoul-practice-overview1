<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class 1 - Tag Hyperlink</title>
  </head>
  <body>
    <h1>Tag Hyperlink</h1>

    <!-- Hyperlink Dengan Contoh Sederhana -->
    <a href="https://www.instagram.com">Buka Instagram</a>
    <a href="./1-teks.html">Buka Materi Teks</a>

    <hr />

    <!-- Hyperlink Dengan Contoh Attribute Target -->
    <a href="https://www.youtube.com" target="_blank">Buka Youtube</a>
    <a href="https://www.youtube.com" target="_parent">Buka Youtube</a>
    <a href="https://www.youtube.com" target="_top">Buka Youtube</a>
    <a href="https://www.youtube.com" target="_self">Buka Youtube</a>
    <hr />

    <!-- Hyperlink Dengan Contoh Attribute Title -->
    <a
      href="https://www.google.com"
      target="_blank"
      title="Ini akan buka google"
      >Buka Tab Google</a
    >

    <!-- Hyperlink Dengan Contoh Membuka Email -->
    <a href="mailto:info@example.com">Test Email</a>

    <!-- Hyperlink Dengan Contoh Membuka Nomor Telpon -->
    <a href="tel:+628515123213">Test Nomor Hape</a>
  </body>
</html>
